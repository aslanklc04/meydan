# Geliştirme ortamı — tek komutla ayağa kalkar:  docker compose up -d
#
# Uygulamanın kendisi bilinçli olarak host'ta çalıştırılır (hızlı HMR).
# Burada yalnızca durum tutan servisler var; gereksiz karmaşıklık eklenmez.

services:
  postgres:
    image: postgres:16-alpine
    container_name: meydan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: meydan
      POSTGRES_PASSWORD: meydan
      POSTGRES_DB: meydan
    ports:
      - '5432:5432'
    volumes:
      - meydan-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U meydan -d meydan']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: meydan-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'no']
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # Yerel e-posta yakalayıcı: doğrulama ve parola sıfırlama akışları için.
  # Arayüz: http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: meydan-mailpit
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  meydan-pgdata:
